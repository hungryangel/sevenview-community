<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>SevenView social card source</title>
<style>
@font-face { font-family: Pretendard; src: url('/fonts/PretendardVariable.woff2') format('woff2'); }
:root { --paper: #fff; --ink: #262c2e; --deep: #01202c; --mint: #def2f7; --muted: #5d6d73; }
* { box-sizing: border-box; }
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; font-family: Pretendard, sans-serif; background: var(--paper); color: var(--ink); }
main { height: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.copy { padding: 48px 0 40px 48px; position: relative; z-index: 1; }
.logo { width: 112px; height: auto; }
.eyebrow { font-size: 16px; letter-spacing: .12em; color: var(--muted); margin: 36px 0 12px; }
h1 { font-size: 64px; font-weight: 650; letter-spacing: -.04em; margin: 0; }
h2 { font-size: 36px; line-height: 1.4; font-weight: 600; letter-spacing: -.03em; margin: 24px 0; }
.detail { font-size: 20px; line-height: 1.6; color: var(--muted); }
.foot { font-size: 18px; color: var(--deep); margin-top: 40px; }
.visual { background: linear-gradient(140deg, var(--paper), var(--mint)); position: relative; padding: 48px 32px 0 20px; }
.screen { width: 640px; max-width: none; border-radius: 20px; box-shadow: 0 24px 48px #01202c20; margin-top: 36px; }
.caption { position: absolute; bottom: 24px; right: 32px; font-size: 14px; color: var(--muted); }
</style>
<main>
  <section class="copy">
    <img class="logo" src="/brand/velnoc-wordmark.png" alt="VELNOC">
    <p class="eyebrow">FREE &amp; OPEN SOURCE</p>
    <h1>SevenView</h1>
    <h2>사진 정리부터<br>전후 비교까지.</h2>
    <p class="detail">정렬 · 크롭 · 슬라이더 비교 · 결과물 저장<br>사진은 내 브라우저에서 처리합니다.</p>
    <p class="foot">설치·가입 없이 시작하는 Community</p>
  </section>
  <div class="visual">
    <img class="screen" src="/examples/workspace.png" alt="SevenView 실제 작업 화면">
    <span class="caption">기존 합성 예시 인물 · 실제 제품 화면</span>
  </div>
</main>
</html>
